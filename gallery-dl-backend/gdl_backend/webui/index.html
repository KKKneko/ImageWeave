<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="ImageWeave 复古桌面 WebUI">
  <link rel="icon" href="data:,">
  <title>ImageWeave — 聚合爬图</title>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/desktop.css">
  <link rel="stylesheet" href="./styles/controls.css">
  <link rel="stylesheet" href="./styles/status.css">
  <link rel="stylesheet" href="./styles/dialog.css">
  <link rel="stylesheet" href="./styles/apps/crawl.css">
  <link rel="stylesheet" href="./styles/apps/tasks.css">
  <link rel="stylesheet" href="./styles/apps/proxy.css">
  <link rel="stylesheet" href="./styles/apps/vault.css">
  <link rel="stylesheet" href="./styles/apps/review.css">
  <link rel="stylesheet" href="./styles/apps/policy.css">
  <link rel="stylesheet" href="./styles/apps/diagnostics.css">
  <link rel="stylesheet" href="./styles/responsive.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <button type="button" class="skip-link" data-skip-link>跳到当前应用</button>

  <div class="desktop" data-desktop>
    <div class="cloud-background" data-cloud-background data-cloud-state="loading" aria-hidden="true">
      <img
        data-cloud-fallback
        src="./assets/dithered-cloud-fallback.png"
        alt=""
        width="1440"
        height="900"
        decoding="async"
      >
      <canvas data-cloud-canvas aria-hidden="true"></canvas>
    </div>

    <nav class="desktop-icons" data-desktop-icons aria-label="ImageWeave 应用快捷方式"></nav>

    <section
      class="application-window"
      data-application-window
      aria-labelledby="window-title"
      hidden
    >
      <header class="window-titlebar">
        <strong id="window-title" data-window-title>C:\IMAGEWEAVE\CRAWL.EXE</strong>
        <div class="window-actions" aria-label="窗口操作">
          <button type="button" data-window-minimize aria-label="最小化窗口" title="最小化">
            <span aria-hidden="true">—</span>
          </button>
          <button
            type="button"
            data-window-maximize
            aria-label="最大化窗口"
            aria-pressed="false"
            title="最大化"
          >
            <span aria-hidden="true">□</span>
          </button>
          <button type="button" data-window-close aria-label="关闭窗口" title="关闭">
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </header>
      <main id="app-content" class="window-body" data-window-body tabindex="-1"></main>
    </section>

    <aside id="start-menu" class="start-menu" data-start-menu hidden>
      <strong>IMAGEWEAVE — APPLICATIONS</strong>
      <nav data-start-menu-items aria-label="START 开始菜单"></nav>
    </aside>

    <footer class="taskbar" aria-label="ImageWeave 任务栏">
      <button
        type="button"
        class="start-button"
        data-start-button
        aria-controls="start-menu"
        aria-expanded="false"
      >START</button>

      <button
        type="button"
        class="task-window-button"
        data-task-window
        aria-pressed="false"
        hidden
      ></button>

      <div class="taskbar-status" aria-label="系统摘要">
        <span
          class="status-badge status-badge--compact"
          data-status="disabled"
          data-taskbar-summary="api"
        >
          <span aria-hidden="true">—</span><span>API 待检测</span>
        </span>
        <span
          class="status-badge status-badge--compact"
          data-status="disabled"
          data-taskbar-summary="proxy"
        >
          <span aria-hidden="true">—</span><span>代理待检测</span>
        </span>
        <span
          class="status-badge status-badge--compact"
          data-status="disabled"
          data-taskbar-summary="dedup"
        >
          <span aria-hidden="true">—</span><span>去重待检测</span>
        </span>
        <button
          type="button"
          class="taskbar-summary-action"
          data-taskbar-refresh
          aria-label="立即刷新系统摘要"
          title="立即刷新系统摘要"
        >↻</button>
        <button
          type="button"
          class="taskbar-summary-action taskbar-summary-action--diagnostics"
          data-taskbar-diagnostics
          aria-label="打开 DIAG.EXE 查看脱敏诊断"
          title="打开 DIAG.EXE"
        >DIAG</button>
      </div>

      <span class="clock" aria-label="当前本地时间">
        <span data-clock-icon aria-hidden="true">◷</span>
        <time data-clock>--:--</time>
      </span>
    </footer>
  </div>

  <p class="visually-hidden" data-route-announcer aria-live="polite"></p>
</body>
</html>
