[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gallery-dl-proxy-backend"
version = "0.5.2"
description = "FastAPI job backend for gallery-dl with a native subscription proxy pool"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "httpx2>=2.0",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "requests>=2.31",
  "curl-cffi>=0.13",
  "PySocks>=1.7.1",
  "PyYAML>=6.0",
  "filelock>=3.13",
  "websocket-client>=1.8",
]

# 后端与去重的直接依赖只在本文件维护；requirements*.txt 均由
# scripts/lock-dependencies.sh 生成，普通安装不得手工改锁文件。
[dependency-groups]
dedup-common = [
  "numpy==2.4.2",
  "opencv-python-headless==4.13.0.92",
  "Pillow==12.1.1",
  "tqdm==4.67.3",
]
dedup-cpu = [
  { include-group = "dedup-common" },
  "torch==2.11.0",
  "torchvision==0.26.0",
]
dedup-cuda = [
  { include-group = "dedup-common" },
  "torch==2.11.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
  "torchvision==0.26.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.scripts]
gdl-backend = "gdl_backend.__main__:main"

[tool.setuptools.packages.find]
include = ["gdl_backend*"]

[tool.setuptools.package-data]
gdl_backend = [
  "webui/*.html",
  "webui/styles/*.css",
  "webui/styles/apps/*.css",
  "webui/js/*.js",
  "webui/js/core/*.js",
  "webui/js/components/*.js",
  "webui/js/apps/*.js",
]
